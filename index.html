<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PV TOURNAMENT | Free Fire</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #080812;
      color: white;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(8, 8, 18, 0.95);
      border-bottom: 1px solid #272746;
      padding: 15px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span {
      color: #8b5cf6;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    nav a:hover {
      color: #8b5cf6;
    }

    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background:
        radial-gradient(circle at 50% 30%, #34206e 0%, #100d22 35%, #080812 70%);
    }

    .hero h1 {
      font-size: clamp(45px, 10vw, 90px);
      font-weight: 1000;
      text-transform: uppercase;
      text-shadow: 0 0 25px #8b5cf6;
    }

    .hero h1 span {
      color: #8b5cf6;
    }

    .hero p {
      font-size: 20px;
      margin: 10px 0 25px;
      color: #d1d1e0;
    }

    .btn {
      display: inline-block;
      padding: 14px 25px;
      margin: 7px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      color: white;
      background: #7c3aed;
      box-shadow: 0 0 20px rgba(124, 58, 237, .4);
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      background: #9333ea;
      transform: translateY(-2px);
    }

    .btn-green {
      background: #16a34a;
      box-shadow: 0 0 20px rgba(22, 163, 74, .35);
    }

    section {
      padding: 70px 7%;
    }

    .section-title {
      text-align: center;
      font-size: 35px;
      margin-bottom: 35px;
    }

    .section-title span {
      color: #8b5cf6;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: #111122;
      border: 1px solid #29294a;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
    }

    .card h3 {
      color: #a78bfa;
      margin-bottom: 10px;
    }

    .prize {
      font-size: 45px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 15px rgba(250, 204, 21, .4);
    }
