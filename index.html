<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{height:100%;margin:0}
  body{background:#f3efe6;color:#1d1b18;font-family:Georgia,serif;
       display:flex;align-items:center;justify-content:center;text-align:center}
  main{width:100%;max-width:380px;padding:24px}
  h1{font-size:clamp(2rem,8vw,3.2rem);margin:0 0 12px}
  p{margin:0 0 28px;font-size:1.1rem;opacity:.8}
  button{font:inherit;font-size:1.15rem;padding:14px 36px;border:0;
         border-radius:999px;background:#2b4fd8;color:#fff;cursor:pointer}
  #video{display:none}
  #video .player{width:100%;aspect-ratio:9/16;max-height:80vh;
         border-radius:12px;overflow:hidden;background:#000}
  #video iframe{width:100%;height:100%;border:0}
  #video a{display:inline-block;margin-top:14px;color:#2b4fd8}
</style>
</head>
<body>
  <main>
    <section id="gate">
      <h1>Welcome</h1>
      <p>Tap below to come in and watch.</p>
      <button id="enter">Enter</button>
    </section>

    <div id="video">
      <div class="player"></div>
      <a href="https://www.youtube.com/shorts/SKS58bZtYM4">Open on YouTube</a>
    </div>
  </main>

<script>
  var VIDEO_ID = "SKS58bZtYM4";
  document.getElementById("enter").onclick = function () {
    document.getElementById("gate").style.display = "none";
    var box = document.getElementById("video");
    box.style.display = "block";
    box.querySelector(".player").innerHTML =
      '<iframe src="https://www.youtube.com/embed/' + VIDEO_ID +
      '?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
  };
</script>
</body>
</html>
